# Application Name 
spring.application.name=spring-boot-application
# Spring Security related properties
spring.security.basic.enabled=false
spring.security.form-login.enabled=false
# JWT configuration
jwt.secret= ${JWT_SECRET}
jwt.issuer= ${JWT_ISSUER}
# Data source Configuration
spring.datasource.url= ${DATASOURCE_URL}
spring.datasource.username= ${DATASOURCE_USER}
spring.datasource.password= ${DATASOURCE_PASS}
# Jpa properties 
spring.jpa.hibernate.ddl-auto = none
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQLDialect
# Cors properties
cors.allowed-origin= *
cors.allowedMethods= *
cors.allowedHeaders= *
cors.allowed-credentials= false
cors.corsConfiguration= /**
# Open route api keys
openroute.apikey=${OPENROUTE_APIKEY}
openweather.apikey=${OPENWEATHER_APIKEY}

#Flyway properties
spring.flyway.enabled=false
spring.flyway.databaseType=mysql
spring.flyway.url=${DATASOURCE_URL}
spring.flyway.password= ${DATASOURCE_PASS}
spring.flyway.user= ${DATASOURCE_USER}
spring.flyway.schemas=migrations
spring.flyway.locations=classpath:db/migration/hire_drivers